name: Build Windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check Python imports
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python -c "import quickdeck.main; import quickdeck.arcwheel; import quickdeck.presets; print('imports ok')"

      - name: Get version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $version = "0.0.0"
          }

          Write-Host "Build version: $version"
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build QuickDeck
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --noupx `
            --name QuickDeck `
            --icon "quickdeck/assets/quickdeck.ico" `
            --version-file "version_info.txt" `
            --add-data "quickdeck/assets;quickdeck/assets" `
            --add-data "presets;presets" `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module tkinter `
            run.py

      - name: Check build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\QuickDeck\QuickDeck.exe")) {
            Write-Error "QuickDeck.exe was not created"
            exit 1
          }

          Write-Host "QuickDeck.exe found:"
          Get-Item "dist\QuickDeck\QuickDeck.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler not found: $iscc"
            exit 1
          }

          & $iscc "installer\quickdeck.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Show dist contents
        shell: pwsh
        run: |
          Write-Host "=== dist ==="
          Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length

      - name: Create portable ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\QuickDeck")) {
            Write-Error "dist\QuickDeck does not exist"
            exit 1
          }

          Compress-Archive `
            -Path "dist\QuickDeck" `
            -DestinationPath "dist\QuickDeck-portable.zip" `
            -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickDeck-Windows
          if-no-files-found: error
          path: |
            dist/**/*.exe
            dist/QuickDeck-portable.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/QuickDeck-portable.zip
          generate_release_notes: true
